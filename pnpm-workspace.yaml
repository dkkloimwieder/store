cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: 'no-downgrade'

peerDependencyRules:
  allowedVersions:
    '@vue/composition-api>vue': '>= 2.5'
    # Solid 2 transition (remove at Solid 2 GA): testing-library declares `>=2.0.0`
    # peers, and semver only admits a prerelease when some comparator in the range
    # shares its [major,minor,patch] — so `>=2.0.0` does not match `2.0.0-beta.30`.
    '@solidjs/testing-library>solid-js': '>=2.0.0-0 <3.0.0'
    '@solidjs/testing-library>@solidjs/web': '>=2.0.0-0 <3.0.0'

packages:
  - 'packages/**'
  - 'examples/angular/**'
  - 'examples/react/**'
  - 'examples/solid/**'
  - 'examples/vue/**'
  - 'examples/svelte/**'
  - 'examples/preact/**'
  - 'examples/lit/**'
  - 'examples/octane/**'

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build (could enable for better build perf)
  esbuild: true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build

  # @tanstack/vue-store
  vue-demi: true # only required for vue 2 support
